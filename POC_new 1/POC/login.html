<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Anzenn Safety Alerts</title>
    <link rel="stylesheet" href="assets/css/common.css">
</head>
<body class="login-bg">
    <section class="main-dev-for-all elementes-center position-relative">
        <div class="containerc">
            <div class="common-box box-style margin-auto position-relative after-po w-100">
                <div class="uper-bx">

                    <form id="frmLogin"
                          method="post"
                          class="form"
                          autocomplete="off"
                          novalidate="novalidate">

                        <div id="divLoginForm"
                             class="login-form margin-auto">

                            <div class="typography-div">
                                <div class="bx-main-title">
                                    <h1>Welcome!</h1>
                                </div>
                            </div>

                            <div class="form-floating position-relative">
                                <input id="txtEmail"
                                       translate="no"
                                       class="form-control"
                                       placeholder
                                       tabindex="1"
                                       autofocus=""
                                       type="text"
                                       name="Email"
                                    value="">
                                <label class="form-label position-absolute"
                                       data-name="required"
                                       for="txtEmail">
                                    Email
                                </label>
                            </div>

                            <div class="form-floating position-relative">
                                <input id="txtPassword"
                                       translate="no"
                                       type="password"
                                       placeholder
                                       class="form-control"
                                       tabindex="2"
                                       name="Password">
                                <label class="form-label position-absolute"
                                      for="txtPassword">
                                      Password
                                </label>
                            </div>

                            <div class="text-right">
                                <div class="btn-group ">
                                    <button id="btnLogin"
                                            type="button"
                                            tabindex="3"
                                            class="btn-invite">
                                        <span>Login</span>&nbsp; &nbsp;
                                        <span class="nt-arrow-right"></span>
                                    </button>
                                </div>
                            </div>

                        </div>
                    </form>
                </div>
            </div>
        </div>

    </section>

    <div class="loading-wrapper">
        <div class="loading-content">
        </div>
        <div class="loading-text position-absolute">
            Loading...
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="assets/js/script.js"></script>

</body>
</html>
